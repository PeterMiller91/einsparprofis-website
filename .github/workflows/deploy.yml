# Baut die statische Seite und legt das Ergebnis (out/) in den Branch "deploy".
# netcup zieht per Git nur diesen Branch nach /einsparprofis.de/httpdocs/out.
name: Deploy (netcup)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      # Google Fonts antwortet gelegentlich fehlerhaft -> bis zu 3 Versuche
      - name: Build static export
        run: |
          for i in 1 2 3; do
            npx next build --webpack && exit 0
            echo "Build fehlgeschlagen (Versuch $i), neuer Versuch in 20 s ..."
            sleep 20
          done
          exit 1

      - name: Publish out/ to branch deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./out
          enable_jekyll: true
          commit_message: Build
